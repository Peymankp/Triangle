<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رسم مراکز مثلث</title>
<style>
:root{--bg:#f4f6fb;--fg:#1d2333;--card:#fff;--bd:#d6dbe8;--ac:#3b5bdb;--ok:#2b8a3e;--bad:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--fg:#e8eaf2;--card:#1e222d;--bd:#363c4d;--ac:#8aa0ff;--ok:#69db7c;--bad:#ff8787}}
:root[data-theme="dark"]{--bg:#14161d;--fg:#e8eaf2;--card:#1e222d;--bd:#363c4d;--ac:#8aa0ff;--ok:#69db7c;--bad:#ff8787}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.2rem;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#fff;touch-action:none;border:1px solid var(--bd)}
#msg{padding:8px 10px;border-radius:8px;margin-top:8px;line-height:1.8;background:rgba(120,130,160,.15)}
#msg.ok{background:rgba(43,138,62,.15);color:var(--ok)}
#msg.bad{background:rgba(201,42,42,.14);color:var(--bad)}
#guide{line-height:1.9;font-size:.95rem}
bdi{direction:ltr;unicode-bidi:isolate}
</style></head><body><div class="w">
<h1>رسم ارتفاع، میانه، عمودمنصف و نیمساز مثلث</h1>
<div class="card"><div id="step">گام اول: روی صفحه مختصات، سه نقطه را با کلیک انتخاب کن.</div></div>
<canvas id="cv" width="720" height="520"></canvas>
<div id="msg">منتظر انتخاب نقطه‌ها هستم.</div>
<div class="card" style="margin-top:10px">
<div class="row" id="tools">
<button data-t="alt" disabled>ارتفاع</button><button data-t="med" disabled>میانه</button>
<button data-t="per" disabled>عمودمنصف</button><button data-t="ang" disabled>نیمساز</button></div>
<div id="guide" style="margin-top:8px"></div>
<div class="row" style="margin-top:8px">
<button id="show" disabled>نمایش پاسخ صحیح</button><button id="clr" disabled>پاک کردن رسم‌ها</button><button id="rst">شروع مجدد</button></div>
<div id="info" style="margin-top:8px;line-height:1.9"></div></div>
<div style="text-align:center;opacity:.75;font-size:.9rem;padding:8px 0 14px">طراحی و توسعه توسط پیمان کرم‌پور</div>
</div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=720,H=520,S=30,OX=360,OY=260;
const $=id=>document.getElementById(id);
const toP=p=>[OX+p[0]*S,OY-p[1]*S],toW=(x,y)=>[(x-OX)/S,(OY-y)/S];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,k)=>[a[0]*k,a[1]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1],len=a=>Math.hypot(a[0],a[1]),norm=a=>mul(a,1/len(a)),mid=(a,b)=>mul(add(a,b),.5);
const N=['A','B','C'],COL=['#e03131','#2f9e44','#1c7ed6'];
const TL={
alt:{n:'ارتفاع',c:'نقطه برخورد ارتفاع‌ها (مرکز ارتفاعی)',g:'از هر رأس، خطی رسم کن که بر ضلع مقابل آن رأس عمود باشد. اگر مثلث منفرجه است، ضلع را در ذهنت امتداد بده. روی رأس کلیک کن و تا محل دلخواه بکش. باید سه ارتفاع رسم کنی.'},
med:{n:'میانه',c:'نقطه برخورد میانه‌ها (مرکز ثقل)',g:'هر رأس را به وسط ضلع مقابلش وصل کن. روی رأس کلیک کن و تا وسط ضلع مقابل بکش. باید سه میانه رسم کنی.'},
per:{n:'عمودمنصف',c:'نقطه برخورد عمودمنصف‌ها (مرکز دایره محیطی)',g:'از وسط هر ضلع، خطی عمود بر همان ضلع رسم کن. کلیک کن و بکش؛ خط می‌تواند از دو طرف ضلع ادامه پیدا کند. باید سه عمودمنصف رسم کنی.'},
ang:{n:'نیمساز',c:'نقطه برخورد نیمسازها (مرکز دایره محاطی)',g:'از هر رأس، خطی رسم کن که زاویه آن رأس را به دو زاویه مساوی تقسیم کند و تا ضلع مقابل ادامه یابد. باید سه نیمساز رسم کنی.'}};
let pts=[],tool=null,st={},drag=null,flash=null;
const f2=x=>(Math.round(x*100)/100).toString();
function reset(){pts=[];tool=null;st={};drag=null;flash=null;
 document.querySelectorAll('#tools button').forEach(b=>{b.disabled=true;b.classList.remove('on')});
 $('show').disabled=$('clr').disabled=true;$('guide').textContent='';$('info').innerHTML='';
 $('step').textContent='گام اول: روی صفحه مختصات، سه نقطه را با کلیک انتخاب کن.';msg('منتظر انتخاب نقطه‌ها هستم.');draw()}
function msg(t,c){const m=$('msg');m.textContent=t;m.className=c||''}
function lines(t){return [0,1,2].map(i=>{const V=pts[i],P=pts[(i+1)%3],Q=pts[(i+2)%3],e=sub(Q,P);let o;
 if(t=='alt'){const d=norm([-e[1],e[0]]),k=dot(sub(V,P),e)/dot(e,e);o={p:V,d,a:V,b:add(P,mul(e,k)),ext:k<0?[P,add(P,mul(e,k))]:k>1?[Q,add(P,mul(e,k))]:0}}
 else if(t=='med'){const M=mid(P,Q);o={p:V,d:norm(sub(M,V)),a:V,b:M}}
 else if(t=='per'){const M=mid(P,Q),d=norm([-e[1],e[0]]);o={p:M,d,a:add(M,mul(d,-30)),b:add(M,mul(d,30))}}
 else{const u=norm(sub(P,V)),w=norm(sub(Q,V)),lp=len(sub(P,V)),lq=len(sub(Q,V));o={p:V,d:norm(add(u,w)),a:V,b:add(mul(P,lq/(lp+lq)),mul(Q,lp/(lp+lq)))}}
 return o})}
function circ(){const[A,B,C]=pts,d=2*(A[0]*(B[1]-C[1])+B[0]*(C[1]-A[1])+C[0]*(A[1]-B[1])),f=q=>q[0]*q[0]+q[1]*q[1];
 return[(f(A)*(B[1]-C[1])+f(B)*(C[1]-A[1])+f(C)*(A[1]-B[1]))/d,(f(A)*(C[0]-B[0])+f(B)*(A[0]-C[0])+f(C)*(B[0]-A[0]))/d]}
function inc(){const[A,B,C]=pts,a=len(sub(B,C)),b=len(sub(A,C)),c=len(sub(A,B)),s=a+b+c;
 return[(a*A[0]+b*B[0]+c*C[0])/s,(a*A[1]+b*B[1]+c*C[1])/s]}
function center(t){const[A,B,C]=pts;
 if(t=='med')return mul(add(add(A,B),C),1/3);
 if(t=='per')return circ();
 if(t=='alt'){const O=circ();return sub(add(add(A,B),C),mul(O,2))}
 return inc()}
const dl=(q,o)=>Math.abs((q[0]-o.p[0])*o.d[1]-(q[1]-o.p[1])*o.d[0]);
function snap(w){for(const v of pts)if(len(sub(v,w))<.45)return v;return w}
function evalLine(a,b){const L=lines(tool),S_=st[tool],o={p:a,d:norm(sub(b,a))};
 for(let k=0;k<3;k++)if(dl(a,L[k])<.3&&dl(b,L[k])<.3){
  if(S_.found.has(k)){msg('این خط را قبلاً درست رسم کرده‌ای. خط دیگری رسم کن.','bad');return}
  S_.found.add(k);const n=S_.found.size;
  if(n==3){msg('آفرین! هر سه '+TL[tool].n+' درست رسم شد و نقطه برخورد نمایش داده شد.','ok');showCenter()}
  else msg('درست است! '+TL[tool].n+' شماره '+n+' از سه تا را درست رسم کردی. ادامه بده.','ok');
  draw();return}
 const nv=pts.some(v=>dl(v,o)<.3),nm=[0,1,2].some(i=>dl(mid(pts[(i+1)%3],pts[(i+2)%3]),o)<.3);
 let h;
 if(tool=='alt')h=nv?'این خط از یک رأس می‌گذرد اما بر ضلع مقابل عمود نیست.':'ارتفاع باید از یکی از رأس‌ها بگذرد و بر ضلع مقابل عمود باشد.';
 else if(tool=='med')h=nv?'این خط از رأس می‌گذرد اما به وسط ضلع مقابل نمی‌رسد.':'میانه باید از یکی از رأس‌ها شروع شود.';
 else if(tool=='per')h=nm?'این خط از وسط یک ضلع می‌گذرد اما بر آن ضلع عمود نیست.':'عمودمنصف باید از وسط یک ضلع بگذرد. وسط ضلع را دقیق‌تر پیدا کن.';
 else h=nv?'این خط از رأس می‌گذرد اما زاویه را به دو قسمت مساوی تقسیم نمی‌کند.':'نیمساز باید از یکی از رأس‌ها شروع شود.';
 msg('درست نیست. '+h,'bad');flash={a,b};setTimeout(()=>{flash=null;draw()},900)}
function showCenter(){const c=center(tool);
 $('info').innerHTML='<b>'+TL[tool].c+'</b><br>مختصات: <bdi>('+f2(c[0])+' , '+f2(c[1])+')</bdi>'}
function pick(t){tool=t;st[t]=st[t]||{found:new Set(),auto:false};
 document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
 $('guide').textContent=TL[t].g;$('step').textContent='گام دوم: '+TL[t].n+'‌ها را خودت رسم کن.';
 $('info').innerHTML='';if(st[t].found.size==3)showCenter();
 msg('روی نقطه شروع کلیک کن و تا نقطه پایان بکش.');draw()}
function line(a,b,c,w,dash){const p=toP(a),q=toP(b);cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.strokeStyle=c;cx.lineWidth=w;cx.setLineDash(dash||[]);cx.stroke();cx.setLineDash([])}
function dot_(p,r,c){const q=toP(p);cx.beginPath();cx.arc(q[0],q[1],r,0,7);cx.fillStyle=c;cx.fill()}
function circle(c,r,col){const q=toP(c);cx.beginPath();cx.arc(q[0],q[1],r*S,0,7);cx.strokeStyle=col;cx.lineWidth=1.5;cx.setLineDash([6,4]);cx.stroke();cx.setLineDash([])}
function draw(){cx.clearRect(0,0,W,H);cx.font='11px sans-serif';cx.textAlign='center';
 for(let x=-12;x<=12;x++){line([x,-9],[x,9],x?'#e6e9f1':'#222',x?1:1.8)}
 for(let y=-9;y<=9;y++){line([-12,y],[12,y],y?'#e6e9f1':'#222',y?1:1.8)}
 cx.fillStyle='#777';for(let x=-12;x<=12;x+=2)if(x)cx.fillText(x,OX+x*S,OY+13);
 cx.textAlign='right';for(let y=-8;y<=8;y+=2)if(y)cx.fillText(y,OX-4,OY-y*S+4);
 if(pts.length==3){const p=pts.map(toP);cx.beginPath();cx.moveTo(...p[0]);cx.lineTo(...p[1]);cx.lineTo(...p[2]);cx.closePath();cx.fillStyle='rgba(59,91,219,.08)';cx.fill();
  for(let i=0;i<3;i++)line(pts[i],pts[(i+1)%3],'#3b5bdb',2.5);
  if(tool){const L=lines(tool),S_=st[tool];
   if(tool=='alt'&&(S_.found.size==3||S_.auto)){const O=circ(),Hh=sub(add(add(pts[0],pts[1]),pts[2]),mul(O,2));L.forEach((o,k)=>{line(o.a,Hh,COL[k],1.5,[5,4]);line(o.b,Hh,COL[k],1.5,[5,4])})}
   L.forEach((o,k)=>{if(S_.found.has(k)||S_.auto){if(o.ext)line(o.ext[0],o.ext[1],COL[k],1.5,[4,4]);line(o.a,o.b,COL[k],2.5)}});
   if(S_.found.size==3||S_.auto){
    if(tool=='per'){const O=circ();circle(O,len(sub(O,pts[0])),'#888')}
    if(tool=='ang'){const I=inc(),[A,B,C]=pts,ar=Math.abs((B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]))/2,
     pr=len(sub(A,B))+len(sub(B,C))+len(sub(C,A));circle(I,2*ar/pr,'#888')}
    const c=center(tool);dot_(c,6,'#f08c00');const q=toP(c);cx.fillStyle='#b35c00';cx.font='bold 12px sans-serif';cx.textAlign='left';
    cx.fillText('('+f2(c[0])+' , '+f2(c[1])+')',q[0]+9,q[1]-8)}}}
 if(flash)line(flash.a,flash.b,'#c92a2a',2.5,[6,5]);
 if(drag)line(drag.a,drag.b,'#888',2,[3,3]);
 pts.forEach((p,i)=>{dot_(p,5.5,'#1d2333');const q=toP(p);cx.fillStyle='#1d2333';cx.font='bold 13px sans-serif';cx.textAlign='left';
  cx.fillText(N[i]+'('+p[0]+','+p[1]+')',q[0]+8,q[1]-8)})}
function ev(e){const r=cv.getBoundingClientRect();return toW((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height)}
cv.addEventListener('pointerdown',e=>{const w=ev(e);
 if(pts.length<3){const p=[Math.round(w[0]),Math.round(w[1])];
  if(pts.some(q=>q[0]==p[0]&&q[1]==p[1])){msg('این نقطه قبلاً انتخاب شده. نقطه دیگری بزن.','bad');return}
  pts.push(p);
  if(pts.length==3){const[A,B,C]=pts;
   if(Math.abs((B[0]-A[0])*(C[1]-A[1])-(C[0]-A[0])*(B[1]-A[1]))<1e-9){msg('این سه نقطه روی یک خط‌اند و مثلثی ساخته نمی‌شود. دوباره شروع کن.','bad');pts=[];draw();return}
   $('step').textContent='گام دوم: مثلث ساخته شد. یکی از گزینه‌های زیر را انتخاب کن.';
   document.querySelectorAll('#tools button').forEach(b=>b.disabled=false);$('show').disabled=$('clr').disabled=false;
   msg('مثلث رسم شد. حالا ارتفاع، میانه، عمودمنصف یا نیمساز را انتخاب کن.','ok')}
  else msg('نقطه '+N[pts.length-1]+' ثبت شد. نقطه بعدی را انتخاب کن.');
  draw();return}
 if(!tool){msg('ابتدا نوع خط را از دکمه‌ها انتخاب کن.','bad');return}
 const a=snap(w);drag={a,b:a};cv.setPointerCapture(e.pointerId);draw()});
cv.addEventListener('pointermove',e=>{if(!drag)return;drag.b=snap(ev(e));draw()});
cv.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;
 if(len(sub(d.b,d.a))<1){draw();return}evalLine(d.a,d.b);draw()});
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>pick(b.dataset.t));
$('show').onclick=()=>{if(!tool){msg('ابتدا نوع خط را انتخاب کن.','bad');return}
 st[tool].auto=true;showCenter();msg('پاسخ صحیح رسم شد. خط‌های رنگی و نقطه نارنجی، همان نقطه برخورد است.','ok');draw()};
$('clr').onclick=()=>{if(!tool)return;st[tool]={found:new Set(),auto:false};$('info').innerHTML='';msg('رسم‌ها پاک شد. دوباره امتحان کن.');draw()};
$('rst').onclick=reset;
reset();
</script></body></html>
